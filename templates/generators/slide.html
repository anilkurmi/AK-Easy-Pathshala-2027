{% extends "base.html" %}
{% block title %}PPT/Slide Generator{% endblock %}
{% block page_title %}<i class="bi bi-easel"></i> PPT/Slide Generator{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-4"><label class="form-label">Title *</label>
                    <input type="text" class="form-control" name="title" required placeholder="Presentation title"></div>
                <div class="col-md-4"><label class="form-label">Class *</label>
                    <select class="form-select" name="class_name" required><option value="">-- Select --</option>{% for c in classes %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></div>
                <div class="col-md-4"><label class="form-label">Subject *</label>
                    <select class="form-select" name="subject" required><option value="">-- Select --</option>{% for s in subjects %}<option value="{{ s }}">{{ s }}</option>{% endfor %}</select></div>
                <div class="col-md-4"><label class="form-label">Chapter</label>
                    <input type="text" class="form-control" name="chapter"></div>
                <div class="col-md-4"><label class="form-label">Language</label>
                    <select class="form-select" name="language"><option value="English">English</option><option value="Nepali">Nepali</option></select></div>
            </div>
            <div class="mt-3"><label class="form-label">Slides Content (one slide per line)</label>
                <textarea class="form-control" name="slides_content" rows="8" placeholder="Slide 1: Title and Introduction&#10;Slide 2: Key Concepts&#10;Slide 3: Examples&#10;..."></textarea></div>
            <div class="mt-3"><button type="submit" class="btn btn-primary"><i class="bi bi-magic"></i> Generate PPT</button></div>
        </form>
    </div>
</div>
{% endblock %}
