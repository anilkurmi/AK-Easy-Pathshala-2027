{% extends "base.html" %}
{% block title %}Lesson Plan Generator{% endblock %}
{% block page_title %}<i class="bi bi-briefcase"></i> Lesson Plan Generator{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-3"><label class="form-label">Class *</label>
                    <select class="form-select" name="class_name" required><option value="">-- Select --</option>{% for c in classes %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></div>
                <div class="col-md-3"><label class="form-label">Subject *</label>
                    <select class="form-select" name="subject" required><option value="">-- Select --</option>{% for s in subjects %}<option value="{{ s }}">{{ s }}</option>{% endfor %}</select></div>
                <div class="col-md-3"><label class="form-label">Chapter *</label>
                    <input type="text" class="form-control" name="chapter" required placeholder="Chapter name"></div>
                <div class="col-md-3"><label class="form-label">Topic</label>
                    <input type="text" class="form-control" name="topic" placeholder="Specific topic"></div>
                <div class="col-md-2"><label class="form-label">Duration</label>
                    <input type="text" class="form-control" name="duration" value="45 minutes"></div>
                <div class="col-md-2"><label class="form-label">Language</label>
                    <select class="form-select" name="language"><option value="English">English</option><option value="Nepali">Nepali</option></select></div>
            </div>
            <div class="row g-3 mt-2">
                <div class="col-md-6"><label class="form-label">Learning Objectives</label>
                    <textarea class="form-control" name="objectives" rows="3" placeholder="What students will learn..."></textarea></div>
                <div class="col-md-6"><label class="form-label">Content</label>
                    <textarea class="form-control" name="content" rows="3" placeholder="Lesson content..."></textarea></div>
                <div class="col-md-6"><label class="form-label">Activities</label>
                    <textarea class="form-control" name="activities" rows="3" placeholder="Teaching activities..."></textarea></div>
                <div class="col-md-6"><label class="form-label">Assessment</label>
                    <textarea class="form-control" name="assessment" rows="3" placeholder="Assessment methods..."></textarea></div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-magic"></i> Generate Lesson Plan</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
