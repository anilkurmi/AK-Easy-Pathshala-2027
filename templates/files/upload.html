{% extends "base.html" %}
{% block title %}Upload File{% endblock %}
{% block page_title %}<i class="bi bi-cloud-upload"></i> Upload File{% endblock %}
{% block content %}
<div class="card"><div class="card-body">
    <form method="POST" enctype="multipart/form-data">
        <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Select File *</label>
                <input type="file" class="form-control" name="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.png,.zip" required></div>
            <div class="col-md-6"><label class="form-label">Category</label>
                <select class="form-select" name="category">
                    <option value="student-list">Student List</option>
                    <option value="curriculum">Curriculum</option>
                    <option value="question-paper">Question Paper</option>
                    <option value="lesson-plan">Lesson Plan</option>
                    <option value="worksheet">Worksheet</option>
                    <option value="report-card">Report Card</option>
                    <option value="other">Other</option>
                </select></div>
            <div class="col-md-6"><label class="form-label">Class</label>
                <select class="form-select" name="class_name"><option value="">--</option>{% for c in classes %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></div>
            <div class="col-md-6"><label class="form-label">Subject</label>
                <select class="form-select" name="subject"><option value="">--</option>{% for s in subjects %}<option value="{{ s }}">{{ s }}</option>{% endfor %}</select></div>
            <div class="col-12"><label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="3" placeholder="Describe the file..."></textarea></div>
        </div>
        <div class="mt-4"><button type="submit" class="btn btn-primary"><i class="bi bi-upload"></i> Upload</button>
            <a href="{{ url_for('files_list') }}" class="btn btn-outline-light ms-2">Cancel</a></div>
    </form>
</div></div>
{% endblock %}
