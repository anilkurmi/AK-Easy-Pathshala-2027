{% extends "base.html" %}
{% block title %}Add Notice{% endblock %}
{% block page_title %}<i class="bi bi-plus-circle"></i> Add Notice{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-8"><label class="form-label">Title *</label><input type="text" class="form-control" name="title" required></div>
                <div class="col-md-4"><label class="form-label">Target</label>
                    <select class="form-select" name="target"><option value="all">All</option><option value="students">Students</option><option value="teachers">Teachers</option></select></div>
                <div class="col-12"><label class="form-label">Content *</label><textarea class="form-control" name="content" rows="5" required></textarea></div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary"><i class="bi bi-megaphone"></i> Publish Notice</button>
                <a href="{{ url_for('school_notices') }}" class="btn btn-outline-light ms-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
