{% extends "base.html" %}
{% block title %}Register - AK Easy Pathshala{% endblock %}
{% block fullpage %}
<div class="login-page">
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-person-plus"></i>
            <h3>Register</h3>
            <p>Create your account</p>
        </div>
        <div class="login-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="name" required placeholder="Enter your name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" required placeholder="Enter email">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required placeholder="Create password">
                </div>
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select class="form-select" name="role">
                        <option value="teacher">Teacher</option>
                        <option value="student">Student</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Register</button>
            </form>
            <div class="text-center">
                <a href="{{ url_for('login') }}" style="color: var(--accent);">Already have an account? Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
