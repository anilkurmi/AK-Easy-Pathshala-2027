{% extends "base.html" %}
{% block title %}Register - AK Easy Pathshala{% endblock %}
{% block fullpage %}
<div class="login-page">
    <div class="front-banner">
        <div class="banner-overlay"></div>
        <div class="banner-content">
            <div class="banner-logo">
                <i class="bi bi-book-half"></i>
            </div>
            <h1 class="banner-title">AK Easy Pathshala</h1>
            <p class="banner-tagline">AI Your Teaching Partner</p>
            <div class="banner-info">
                <span><i class="bi bi-envelope"></i> {{ SITE_EMAIL }}</span>
                <span><i class="bi bi-telephone"></i> {{ SITE_PHONE }}</span>
            </div>
            <div class="banner-social">
                <a href="{{ SOCIAL_FACEBOOK }}" target="_blank" title="Facebook"><i class="bi bi-facebook"></i></a>
                <a href="{{ SOCIAL_INSTAGRAM }}" target="_blank" title="Instagram"><i class="bi bi-instagram"></i></a>
                <a href="{{ SOCIAL_TWITTER }}" target="_blank" title="Twitter"><i class="bi bi-twitter-x"></i></a>
            </div>
        </div>
    </div>
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-person-plus"></i>
            <h3>Register</h3>
            <p>Create your account</p>
        </div>
        <div class="login-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="name" required placeholder="Enter your name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" required placeholder="Enter email">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required placeholder="Create password">
                </div>
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select class="form-select" name="role">
                        <option value="teacher">Teacher</option>
                        <option value="student">Student</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Register</button>
            </form>
            <div class="text-center">
                <a href="{{ url_for('login') }}" style="color: var(--accent);">Already have an account? Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
